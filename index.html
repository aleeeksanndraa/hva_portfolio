<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sasha — Digital Design / Interaction Design</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="assets/chrome-mark.png">
<link rel="apple-touch-icon" href="assets/chrome-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/desktop.css">
</head>
<body class="booting">
<div id="desktop">
  <div id="wallpaper" aria-hidden="true">
    <div class="wp-grid"></div>
    <i class="wp-moon"></i>
    <div class="wp-city">
      <i class="wp-lights l1"></i><i class="wp-lights l2"></i><i class="wp-lights l3"></i>
      <i class="wp-boat"></i>
    </div>
    <img src="assets/chrome-cursor.png" alt="" class="wp-obj" style="right: 7vw; top: 9vh; width: 13vw; transform: rotate(14deg);">
    <i class="sparkle" style="left: 22%; top: 12%; font-size: 26px;">✦</i>
    <i class="sparkle p" style="left: 74%; top: 22%; font-size: 18px; animation-delay: -1s;">✦</i>
    <i class="sparkle" style="left: 84%; top: 58%; font-size: 30px; animation-delay: -2s;">✦</i>
    <i class="sparkle n" style="left: 12%; top: 66%; font-size: 14px; animation-delay: -0.5s;">✦</i>
    <i class="sparkle p" style="left: 30%; top: 80%; font-size: 22px; animation-delay: -1.7s;">✦</i>
    <i class="sparkle" style="left: 63%; top: 8%; font-size: 12px; animation-delay: -2.6s;">✦</i>
    <i class="sparkle n" style="left: 92%; top: 34%; font-size: 12px; animation-delay: -1.2s;">✦</i>
  </div>
  <canvas id="pixels" aria-hidden="true"></canvas>

  <!-- desktop icons -->
  <nav id="icons" aria-label="Desktop">
    <button class="icon" type="button" data-open="archive"><img src="assets/chrome-folder.png" alt=""><span>Projects</span></button>
    <button class="icon" type="button" data-open="about"><img src="assets/chrome-mark.png" alt=""><span>about_me.txt</span></button>
    <button class="icon" type="button" data-open="snake"><canvas class="icon-snake" width="16" height="16"></canvas><span>snake.exe</span></button>
    <button class="icon" type="button" data-open="blocks"><svg viewBox="0 0 32 32" class="icon-svg icon-blocks" aria-hidden="true"><rect x="4" y="16" width="8" height="8" fill="#b4a7dd"/><rect x="12" y="16" width="8" height="8" fill="#8a6fc4"/><rect x="20" y="16" width="8" height="8" fill="#b4a7dd"/><rect x="12" y="8" width="8" height="8" fill="#d7a3bd"/><path d="M4 16h24v8H4zM12 8h8v8M12 16v8M20 16v8" fill="none" stroke="#2e2452" stroke-width="1.6"/></svg><span>blocks.exe</span></button>
    <button class="icon" type="button" data-open="flap"><svg viewBox="0 0 32 32" class="icon-svg icon-flap" aria-hidden="true"><rect x="22" y="2" width="7" height="10" fill="#e6e7ee"/><rect x="22" y="21" width="7" height="9" fill="#e6e7ee"/><circle cx="12" cy="16" r="6" fill="#d7a3bd"/><path d="M22 2h7v10h-7zM22 21h7v9h-7z" fill="none" stroke="#2e2452" stroke-width="1.6"/><circle cx="12" cy="16" r="6" fill="none" stroke="#2e2452" stroke-width="1.6"/><path d="M8 15h8" stroke="#2e2452" stroke-width="2.4"/><path d="M3 6l3 3M3 26l3-3" stroke="#2e2452" stroke-width="1.4"/></svg><span>mlg_flap.exe</span></button>
    <button class="icon" type="button" data-open="stars"><i class="icon-glyph">✦</i><span>stars.txt</span></button>
    <button class="icon" type="button" data-open="trash"><svg viewBox="0 0 32 32" class="icon-svg" aria-hidden="true"><path d="M8 9h16l-1.6 19H9.6z" fill="#e9e9ee" stroke="#111110" stroke-width="1.6"/><path d="M6 9h20M13 9V5h6v4M12.5 13l.6 11M16 13v11M19.5 13l-.6 11" fill="none" stroke="#111110" stroke-width="1.6"/></svg><span>Recycle Bin</span></button>
  </nav>

  <!-- centre: the face, with project windows orbiting -->
  <section id="orbit" aria-label="Projects">
    <div id="ring"></div>
    <div class="face-win" id="face-win">
      <div class="win-body" id="face" role="img" aria-label="Sasha's iridescent porcelain face, watching your cursor">
        <div class="face-stage">
          <div class="head" id="head">
            <canvas class="head-px" id="head-px" width="420" height="420"></canvas>
          </div>
        </div>
      </div>
    </div>
    <div id="card-caption" aria-live="polite">
      <div class="cap-title" id="cap-title">CUSTOM BADGE</div>
      <div class="cap-meta"><span id="cap-index">01</span> · <span id="cap-meta">Digital Design · 2026</span> · <span class="cap-hint">double-click to open</span></div>
    </div>
  </section>

  <!-- windows get created here -->
  <div id="windows"></div>

  <!-- start menu -->
  <div id="start-menu" hidden role="menu">
    <div class="sm-side"><span>✦ SASHA OS 2026</span></div>
    <div class="sm-items" id="sm-items"></div>
  </div>

  <!-- taskbar -->
  <footer id="taskbar">
    <button id="start-btn" type="button" aria-haspopup="true" aria-expanded="false"><img src="assets/chrome-mark.png" alt="">Start</button>
    <div id="tasks"></div>
    <span id="frame-label" class="tray-status">♡ sasha os 2026 · online</span>
    <div id="tray">
      <button type="button" id="tray-stars" data-open="stars" title="Stars collected">✦ <span id="stars-count">0</span>/<span id="stars-total">7</span></button>
      <button type="button" id="tray-sound" aria-pressed="false" title="Sound">🔇</button>
      <span id="clock">00:00</span>
    </div>
  </footer>

  <div id="balloon" aria-live="polite"></div>
</div>
<div id="boot" role="status" aria-live="polite">
  <div class="boot-box">
    <div class="win-bar"><span class="win-title">loading sasha_os.exe</span><span class="win-btns"><i>_</i><i>□</i><i>×</i></span></div>
    <div class="boot-body">
      <img class="boot-chrome" src="assets/chrome-mark.png" alt="">
      <div class="boot-logo">SASHA OS</div>
      <div class="boot-sub">process book · digital design · hva</div>
      <div class="boot-track"><i id="boot-bar"></i></div>
      <div class="boot-row"><span id="boot-line">waking up…</span><span id="boot-pct">000%</span></div>
    </div>
  </div>
</div>
<script src="js/projects.js"></script>
<script src="js/script.js"></script>
</body>
</html>
