<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sasha — Digital Design / Interaction Design</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="assets/chrome-mark.png">
<link rel="apple-touch-icon" href="assets/chrome-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/desktop.css">
</head>
<body>
<div id="desktop">
  <div id="wallpaper" aria-hidden="true">
    <div class="wp-grid"></div>
    <img src="assets/chrome-cursor.png" alt="" class="wp-obj" style="right: 7vw; top: 9vh; width: 13vw; transform: rotate(14deg);">
    <img src="assets/pin-silver.png" alt="" class="wp-obj" style="right: 15vw; bottom: 14vh; width: 8vw; transform: rotate(-10deg);">
    <div class="wp-word">SASHA&nbsp;OS</div>
  </div>
  <canvas id="pixels" aria-hidden="true"></canvas>
  <div class="corner-label" style="right: 16px; top: 14px;">// process book: sasha</div>
  <div class="corner-label" id="frame-label" style="left: 16px; bottom: 52px;">frame 0000 · tracking</div>

  <!-- desktop icons -->
  <nav id="icons" aria-label="Desktop">
    <button class="icon" type="button" data-open="archive"><img src="assets/chrome-folder.png" alt=""><span>Projects</span></button>
    <button class="icon" type="button" data-open="about"><img src="assets/chrome-mark.png" alt=""><span>about_me.txt</span></button>
    <button class="icon" type="button" data-open="snake"><canvas class="icon-snake" width="16" height="16"></canvas><span>snake.exe</span></button>
    <button class="icon" type="button" data-open="stars"><i class="icon-glyph">✦</i><span>stars.txt</span></button>
    <button class="icon" type="button" data-open="trash"><svg viewBox="0 0 32 32" class="icon-svg" aria-hidden="true"><path d="M8 9h16l-1.6 19H9.6z" fill="#e9e9ee" stroke="#111110" stroke-width="1.6"/><path d="M6 9h20M13 9V5h6v4M12.5 13l.6 11M16 13v11M19.5 13l-.6 11" fill="none" stroke="#111110" stroke-width="1.6"/></svg><span>Recycle Bin</span></button>
  </nav>

  <!-- centre: the face, with project windows orbiting -->
  <section id="orbit" aria-label="Projects">
    <div id="ring"></div>
    <div class="win face-win" id="face-win">
      <div class="win-bar"><span class="win-title">sasha.exe</span><span class="win-btns"><i>_</i><i>□</i><i>×</i></span></div>
      <div class="win-body" id="face" role="img" aria-label="A porcelain face that watches your cursor">
        <svg viewBox="0 0 300 380" class="face-svg" aria-hidden="true">
          <defs>
            <radialGradient id="porcelain" cx="42%" cy="34%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.55" stop-color="#f1efea"/><stop offset="1" stop-color="#cfccc4"/></radialGradient>
            <radialGradient id="cheek" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#b5a0c9" stop-opacity="0.8"/><stop offset="1" stop-color="#b5a0c9" stop-opacity="0"/></radialGradient>
            <radialGradient id="iris" cx="40%" cy="38%" r="65%"><stop offset="0" stop-color="#a488cb"/><stop offset="0.6" stop-color="#3f2871"/><stop offset="1" stop-color="#111110"/></radialGradient>
            <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
            <clipPath id="eyeL"><ellipse cx="102" cy="178" rx="31" ry="17"/></clipPath>
            <clipPath id="eyeR"><ellipse cx="198" cy="178" rx="31" ry="17"/></clipPath>
          </defs>
          <path d="M150 18 C 238 18 272 96 270 178 C 268 262 222 352 150 358 C 78 352 32 262 30 178 C 28 96 62 18 150 18 Z" fill="url(#porcelain)" stroke="#c9c6bd" stroke-width="1.2"/>
          <path d="M92 52 C 118 34 168 30 196 44" fill="none" stroke="url(#gloss)" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
          <path d="M238 74 L 226 104 L 236 118 L 219 150 L 228 164" fill="none" stroke="#9c998f" stroke-width="1.1" stroke-linejoin="round" opacity="0.55"/>
          <path d="M70 140 C 86 128 116 126 132 136" fill="none" stroke="#8a8880" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M168 136 C 184 126 214 128 230 140" fill="none" stroke="#8a8880" stroke-width="2.4" stroke-linecap="round"/>
          <g class="eye" id="eye-l">
            <ellipse cx="102" cy="178" rx="31" ry="17" fill="#fbfaf7" stroke="#2a2a27" stroke-width="2"/>
            <g clip-path="url(#eyeL)"><g id="pupil-l"><circle cx="102" cy="178" r="13" fill="url(#iris)"/><circle cx="102" cy="178" r="5.5" fill="#050505"/><circle cx="97" cy="173" r="3" fill="#fff"/></g></g>
            <path d="M70 172 C 84 156 120 156 134 172" fill="none" stroke="#111110" stroke-width="3" stroke-linecap="round"/>
          </g>
          <g class="eye" id="eye-r">
            <ellipse cx="198" cy="178" rx="31" ry="17" fill="#fbfaf7" stroke="#2a2a27" stroke-width="2"/>
            <g clip-path="url(#eyeR)"><g id="pupil-r"><circle cx="198" cy="178" r="13" fill="url(#iris)"/><circle cx="198" cy="178" r="5.5" fill="#050505"/><circle cx="193" cy="173" r="3" fill="#fff"/></g></g>
            <path d="M166 172 C 180 156 216 156 230 172" fill="none" stroke="#111110" stroke-width="3" stroke-linecap="round"/>
          </g>
          <path d="M150 196 C 146 220 140 238 146 246 C 150 250 156 249 160 246" fill="none" stroke="#b6b4ac" stroke-width="2" stroke-linecap="round"/>
          <ellipse cx="88" cy="232" rx="30" ry="18" fill="url(#cheek)"/>
          <ellipse cx="212" cy="232" rx="30" ry="18" fill="url(#cheek)"/>
          <path d="M124 284 C 136 276 146 278 150 282 C 154 278 164 276 176 284 C 164 298 136 298 124 284 Z" fill="#7c5bc8"/>
          <path d="M126 284 C 140 288 160 288 174 284" fill="none" stroke="#3f2871" stroke-width="1.4"/>
        </svg>
      </div>
    </div>
    <div id="card-caption" aria-live="polite">
      <div class="cap-title" id="cap-title">CUSTOM BADGE</div>
      <div class="cap-meta"><span id="cap-index">01</span> · <span id="cap-meta">Digital Design · 2026</span> · <span class="cap-hint">double-click to open</span></div>
    </div>
  </section>

  <!-- windows get created here -->
  <div id="windows"></div>

  <!-- start menu -->
  <div id="start-menu" hidden role="menu">
    <div class="sm-side"><span>SASHA OS 2026</span></div>
    <div class="sm-items" id="sm-items"></div>
  </div>

  <!-- taskbar -->
  <footer id="taskbar">
    <button id="start-btn" type="button" aria-haspopup="true" aria-expanded="false"><img src="assets/chrome-mark.png" alt="">Start</button>
    <div id="tasks"></div>
    <div id="tray">
      <button type="button" id="tray-stars" data-open="stars" title="Stars collected">✦ <span id="stars-count">0</span>/<span id="stars-total">7</span></button>
      <button type="button" id="tray-sound" aria-pressed="false" title="Sound">🔇</button>
      <span id="clock">00:00</span>
    </div>
  </footer>

  <div id="balloon" aria-live="polite"></div>
</div>
<script src="js/projects.js"></script>
<script src="js/script.js"></script>
</body>
</html>
